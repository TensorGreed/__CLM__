spring:
  application:
    name: clm-backend
  datasource:
    url: ${CLM_DATABASE_URL:jdbc:postgresql://localhost:5432/clm}
    username: ${CLM_DATABASE_USERNAME:clm}
    password: ${CLM_DATABASE_PASSWORD:clm_dev_password}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

server:
  port: ${PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: CLM backend
    description: Certificate lifecycle management API foundation

debug: false

logging:
  level:
    root: INFO
