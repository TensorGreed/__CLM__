spring:
  application:
    name: clm-backend
  datasource:
    url: ${CLM_DATABASE_URL:jdbc:postgresql://localhost:5432/clm}
    username: ${CLM_DATABASE_USERNAME:clm}
    password: ${CLM_DATABASE_PASSWORD:clm_dev_password}
  flyway:
    enabled: true
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

server:
  port: ${PORT:8080}

management:
  endpoint:
    health:
      probes:
        enabled: true
  endpoints:
    web:
      exposure:
        include: health,info
  info:
    env:
      enabled: true

info:
  app:
    name: CLM backend
    description: Certificate lifecycle management API foundation

debug: false

logging:
  level:
    root: INFO

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui

clm:
  api:
    version: v1
  identity:
    oidc:
      enabled: ${CLM_OIDC_ENABLED:false}
      group-claim: ${CLM_OIDC_GROUP_CLAIM:groups}
  key-handling:
    private-key-import-enabled: ${CLM_PRIVATE_KEY_IMPORT_ENABLED:false}
    storage-provider: ${CLM_KEY_STORAGE_PROVIDER:disabled}
    database-persistence-enabled: ${CLM_PRIVATE_KEY_DATABASE_PERSISTENCE_ENABLED:false}
  logging:
    correlation-header: X-Correlation-ID
